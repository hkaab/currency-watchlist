name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CurrencyWatchlist.slnx

      - name: Build
        run: dotnet build CurrencyWatchlist.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test CurrencyWatchlist.slnx --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage-results

      - name: Compute coverage percentage
        id: coverage
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:coverage-results/**/coverage.cobertura.xml" "-targetdir:coverage-results/report" "-reporttypes:TextSummary"
          cat coverage-results/report/Summary.txt
          PCT=$(grep -oP 'Line coverage: \K[0-9.]+' coverage-results/report/Summary.txt)
          echo "Backend line coverage: $PCT%"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Compute coverage percentage
        id: coverage
        run: |
          PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Frontend line coverage: $PCT%"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

  badges:
    name: Update coverage badges
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate badge JSON
        env:
          BACKEND_PCT: ${{ needs.backend.outputs.coverage }}
          FRONTEND_PCT: ${{ needs.frontend.outputs.coverage }}
        run: |
          mkdir -p .github/badges
          color_for() {
            awk -v p="$1" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=60) print "yellow"; else print "red" }'
          }
          BACKEND_COLOR=$(color_for "$BACKEND_PCT")
          FRONTEND_COLOR=$(color_for "$FRONTEND_PCT")
          cat > .github/badges/backend-coverage.json <<EOF
          { "schemaVersion": 1, "label": "backend coverage", "message": "${BACKEND_PCT}%", "color": "${BACKEND_COLOR}" }
          EOF
          cat > .github/badges/frontend-coverage.json <<EOF
          { "schemaVersion": 1, "label": "frontend coverage", "message": "${FRONTEND_PCT}%", "color": "${FRONTEND_COLOR}" }
          EOF

      - name: Commit badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badges [skip ci]"
            git push
          else
            echo "No badge changes to commit."
          fi
